    focus: >
      The path from a physical port to an attached driver: enumeration,
      the transfer model, and how a device class plugs in. Thunderbolt is
      covered as the adjacent PCIe-tunnelling fabric that USB4 converges
      with, not as a separate story.
    # busdma is where USB transfer buffers actually get mapped —
    # reference it. newbus is how usbus and its children attach.
    scope_guard: >
      This chapter owns the USB stack — enumeration, the
      device/config/interface/endpoint model, the transfer engine and its
      four transfer types, hub/port handling, the host-controller
      interface (xHCI), and how a class driver binds — plus the
      Thunderbolt/USB4 fabric (NHI, router, PCIe tunnelling). Do NOT
      re-derive busdma tag/map mechanics (DMA and busdma chapter) or
      newbus attachment (Device Driver Framework chapter); reference
      both. Do NOT explain CAM: umass is covered only as far as where it
      hands off (CAM chapter owns the rest). Audio-class devices belong
      to the Sound chapter beyond the transfer layer.
    key_questions:
      - "What exactly happens between a device being plugged in and a class driver attaching, and which of those steps can sleep?"
      - "Why does USB need its own per-bus process (usb_process.c) rather than running callbacks in the interrupt handler?"
      - "How do the four transfer types differ in scheduling guarantees, and why does isochronous (uvideo) need different handling from bulk (umass)?"
      - "What does xHCI change versus earlier host controllers, and how much of that leaks into the driver-facing KPI?"
      - "How does Thunderbolt's router/NHI model tunnel PCIe, and what security exposure does that create that plain USB does not?"
    mermaid: sequence
