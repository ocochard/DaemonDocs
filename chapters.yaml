      - "How does a feeder chain get built for a given client format vs. hardware format, and where does the conversion cost land?"
      - "How does vchan let several applications play at once when the hardware has one stream, and what is lost versus exclusive access?"
      - "What does hdaa.c have to infer from HDA widget/association data, and why does that inference make laptop audio fragile?"
      - "Where does the userland virtual_oss(8) daemon sit relative to /dev/dsp, and what does it enable that the kernel path cannot?"
