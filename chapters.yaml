    focus: >
      Document the kernel half of bhyve, FreeBSD's type-2 hypervisor.
      Userspace bhyve(8) (in usr.sbin/bhyve/) presents the device model
      (virtio, PCI emulation, UEFI, etc.); the kernel module covered
      here owns the VT-x/SVM machinery: vCPU state, EPT/NPT shadow
      paging, VM-exit dispatch, instruction emulation for MMIO, the
      local APIC emulation, and the ioctl interface that userspace
      drives. Cover the vmrun loop, how a guest VM-exits and the
      kernel decides to handle it inline (e.g. APIC writes) vs return
