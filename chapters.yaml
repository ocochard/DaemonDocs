    # usb_device.c is enumeration and the device/config/interface model;
    # usb_hub.c is hub and port handling (where attach/detach storms
    # happen); usb_transfer.c is the transfer engine every driver submits
    # through; usb_request.c is control-request plumbing; usb_process.c is
