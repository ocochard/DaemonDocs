    focus: >
      Document the DTrace framework as it lives in the FreeBSD kernel.
      Cover the architecture: providers (sdt, fbt, syscall, profile,
      proc, fasttrap, etc.) register probes with the DTrace framework;
      the DIF interpreter executes user-supplied D code in-kernel against
      probe context; ECBs (Enabling Control Blocks) and aggregations
      record results; the userspace dtrace(1) command parses D, compiles
      to DIF, and pulls results back. Explain how this differs from
      ad-hoc kernel printf debugging and why it's safe to enable in
      production.
    key_questions:
      - "What is a DTrace provider, and how does fbt (function boundary tracing) instrument every kernel function at runtime?"
      - "What does the DIF interpreter actually execute, and why is that bounded/safe (no loops, bounded memory access)?"
      - "How does an ECB connect a probe to an action, and how do aggregations produce summary statistics without per-event userspace traffic?"
