  - title: "Capsicum — Capability Mode and Sandboxing"
    family: "security-isolation"
    related:
      - "Jails — OS-level Isolation"
      - "Process Management — Scheduling and Lifecycle"
      - "VFS — Virtual File System Layer"
    output_file: "sys/kern/README_capsicum.md"
    source_dirs:
      - "sys/kern"
    source_files:
      - "sys/kern/sys_capability.c"
      - "sys/kern/kern_descrip.c"
      - "sys/sys/capsicum.h"
      - "sys/sys/caprights.h"
    focus: >
      Document Capsicum, FreeBSD's capability-based sandboxing framework.
      Cover the two pieces: capability mode (cap_enter — the process
      drops the ability to access any global namespace) and capability
      rights (per-file-descriptor rights bitmasks limiting what can be
      done with each fd). Explain how this is enforced at the syscall
      entry layer, why it's per-fd rather than per-syscall, and how it
      composes with jails (orthogonal — Capsicum sandboxes individual
      processes, jails partition the system).
    key_questions:
      - "What changes for a process after cap_enter() — which syscalls become unavailable, and why those specifically?"
      - "How are capability rights stored on a struct file, and where is the rights check actually performed?"
      - "How does Capsicum differ architecturally from jails (chapter 12) and from MAC?"
      - "How does a real-world consumer (e.g. tcpdump, dhclient) restructure itself to run capability-mode-clean?"
    mermaid: flowchart

  - title: "Credentials, Privilege, and the MAC Framework — the Access-Control Substrate"
    family: "security-isolation"
    related:
      - "Jails — OS-level Isolation"
      - "Capsicum — Capability Mode and Sandboxing"
      - "VFS — Virtual File System Layer"
    output_file: "sys/kern/README_cred.md"
    source_dirs:
      - "sys/kern"
      - "sys/security/mac"
      - "sys/sys"
    # kern_prot.c owns struct ucred and the uid/gid credential model
    # (setuid/setgid, credential inheritance across fork/exec);
    # kern_priv.c is priv_check(9), the single point every discretionary
    # privilege check funnels through. security/mac is the MAC framework:
    # mac_framework.c is the entry-point dispatcher, mac_policy.h the KPI
    # a policy module implements, mac_process/mac_vfs the labeled-object
    # hooks. ucred.h/priv.h are the KPIs.
    source_files:
      - "sys/kern/kern_prot.c"
      - "sys/kern/kern_priv.c"
      - "sys/security/mac/mac_framework.c"
      - "sys/security/mac/mac_process.c"
      - "sys/security/mac/mac_vfs.c"
      - "sys/sys/ucred.h"
      - "sys/sys/priv.h"
      - "sys/security/mac/mac_policy.h"
    # Jails and Capsicum are *consumers* of this substrate (a jail is a
    # ucred field checked in prison_check; Capsicum is a credential flag
    # plus fd rights). This chapter owns the substrate itself — ucred,
    # priv_check, and MAC — and shows how those two chapters build on it.
    # Do not re-explain jail or Capsicum policy here; reference them.
    scope_guard: >
      This chapter owns the access-control substrate: struct ucred (the
      uid/gid credential every process carries), priv_check(9) (the single
      funnel for discretionary privilege), and the MAC framework (how
      policy modules interpose labeled checks on subjects and objects). Do
      NOT re-explain jails or Capsicum as policies — they are *consumers*
      of this substrate (a jail is a field on ucred; Capsicum is a
      credential flag plus per-fd rights); name the relationship and link
      to those chapters. Do NOT catalog every shipped mac_* module — cover
      the framework and use one or two (mac_bsdextended/ugidfw, mac_mls or
      mac_biba) as concrete examples. Do NOT re-derive the vnode contract
      (VFS chapter); cover only how MAC hooks interpose on VFS operations.
    focus: >
      Document the credential and access-control substrate that jails,
      Capsicum, and file permissions all build on. struct ucred
      (kern_prot.c): the real/effective/saved uid and gid set, supplementary
      groups, the login class and resource-limit pointers, and how a
      credential is copied, shared (reference-counted), and mutated across
      setuid/setgid, fork, and exec. priv_check(9) (kern_priv.c): the
      single choke point every "is this thread allowed to do X" privilege
      question passes through (PRIV_* names), and how jail and MAC get a
      say there. Then the MAC framework (security/mac): how it turns the
      kernel's access-control decisions into a series of hooks
      (mac_framework.c dispatch), how a policy module (mac_policy.h)
      registers to label subjects/objects and vote on operations, and how
      the labeled-object hooks interpose on process and VFS operations
      (mac_process.c, mac_vfs.c). Use a shipped policy or two as concrete
      examples (mac_bsdextended/ugidfw for rule-based file access, MLS/Biba
      for multilevel labels). Frame the whole chapter as "the layer jails
      and Capsicum stand on."
    key_questions:
      - "What is struct ucred, and how does it flow and change across fork, exec, and setuid — who shares a credential and who gets a fresh copy?"
      - "What is priv_check(9), and why does funneling every privilege decision through one function matter for jails and MAC?"
      - "How does the MAC framework let a loadable policy module interpose on an operation — what does a hook look like, and how do multiple policies compose their verdicts?"
      - "How do jails and Capsicum reduce to operations on this substrate (a ucred field, a credential flag) rather than being separate access-control systems?"
    mermaid: class

