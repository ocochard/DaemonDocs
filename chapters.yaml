      - "sys/netinet/tcp_subr.c"
      - "sys/netinet/tcp_syncache.c"
      - "sys/netinet/tcp_timer.c"
      - "sys/netinet/tcp_var.h"
      - "sys/netinet/udp_usrreq.c"
      - "sys/netinet/udp_var.h"
      - "sys/netinet/cc/cc.c"
      - "sys/netinet/cc/cc.h"
    # Without this guard the writer drifts into (a) re-explaining the
    # IP forwarding path, fib lookups, or v4/v6 differences (IP Layer
    # chapter), (b) re-deriving mbuf chain handling (mbuf chapter),
    # or (c) cataloging every cc_*.c module and every tcp_stacks/*
    # file. The 70+ KLOC of rack.c and bbr.c is out of scope — name
    # them as the two production alternative stacks and link to their
    # papers, do not walk through their code.
    scope_guard: >
      This chapter is about the L4 control plane: how struct inpcb
      and struct tcpcb manage connection state, how the TCP state
      machine drives segments through tcp_input/tcp_output, how
      timers and the syncache/SYN-cookies path work, and how UDP
      uses the same inpcb infrastructure with almost no state of
      its own. Do NOT re-explain IP forwarding, the fib/nhop
      rewrite, or v4-vs-v6 differences in the input path — those
      belong to the IP Layer chapter; link to it for "where does
      tcp_input get called from". Do NOT re-explain mbuf chains,
      m_pullup, or pkthdr — link to the mbuf chapter. Do NOT walk
      through each congestion-control module under cc/ or each
      modular stack under tcp_stacks/ — describe the *KPI* (struct
      cc_algo, struct tcp_function_block) and name CUBIC, NewReno,
      DCTCP, RACK, BBR as one-line examples of what plugs in.
    focus: >
      Document FreeBSD's L4 implementation. Open with the inpcb /
      tcpcb pair: inpcb is the protocol-independent (v4/v6, TCP/UDP)
      socket-to-network binding with the global hash tables that
      demux incoming packets to a connection; tcpcb hangs off inpcb
      and holds all TCP-specific state (sequence space, RTT
      estimators, congestion window, timers). Walk the TCP state
      machine through tcp_input.c — header validation, the syncache
      / SYN-cookies fast path for SYN floods, the established-state
      receive processing, ACK handling, fast retransmit and SACK.
      Cover tcp_output.c on the send side: when does the stack send
      (Nagle, delayed ACK, push), how does the segmenter pick a
      length (MSS, TSO offload). Cover tcp_timer.c — retransmit,
      persist, keepalive, 2MSL, and how callouts drive them. Then
      pluggable congestion control: the cc_algo KPI in cc/cc.h, how
      net.inet.tcp.cc.algorithm picks a module, and the production
      alternatives (CUBIC default, NewReno, DCTCP, HTCP, CDG).
      Modular TCP stacks: tcp_function_block lets RACK and BBR
      replace the entire input/output state machine, not just the
      congestion controller. Close with UDP — how udp_usrreq.c
      reuses the inpcb hash with no additional per-connection
      state.
    key_questions:
      - "What does the inpcb hash look up, and how does it demux an incoming TCP/UDP packet to a socket without a per-connection hop table?"
      - "What state lives in struct tcpcb that does not live in struct inpcb, and why is the split useful (UDP, raw IP, divert all reuse inpcb)?"
      - "How does tcp_input.c walk the state machine — what does it do differently in LISTEN, SYN_RECEIVED, ESTABLISHED, and FIN_WAIT_*?"
      - "What is the syncache, and how does it let a listening socket survive a SYN flood without allocating a tcpcb per half-open connection?"
      - "What does tcp_output.c decide each time it is called — when does the stack actually emit a segment vs. waiting?"
      - "What does the cc_algo KPI require a congestion control module to provide, and how does the stack call into it on each ACK / loss / retransmit?"
      - "What does tcp_function_block let RACK and BBR replace, and why is that scope wider than just plugging in via cc_algo?"
      - "Why is UDP so much smaller than TCP — what does udp_usrreq.c do that is not already in in_pcb.c?"
    mermaid: state
