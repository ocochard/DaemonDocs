  - title: "The Socket Layer — sockets, sockbuf, and UNIX-domain"
    family: "networking"
    related:
      - "Network Stack — Architecture and Packet Flow"
      - "Transport Protocols — inpcb, tcpcb, TCP State Machine, UDP"
      - "Signals, kqueue, and IPC — Process Communication and Notification"
    output_file: "sys/kern/README_socket.md"
    source_dirs:
      - "sys/kern"
      - "sys/sys"
    # uipc_socket.c is the socket KPI (socket/bind/connect/send/recv and
    # the socket state machine); uipc_sockbuf.c is the send/receive buffer
    # queueing discipline (sbappend/sbreserve/sbwait/sbwakeup);
    # uipc_usrreq.c is the UNIX-domain (AF_UNIX) protocol including
    # file-descriptor passing over SCM_RIGHTS; uipc_domain.c is the
    # domain/protosw registration that ties an address family to its
    # pr_usrreqs; uipc_accf.c is accept filters.
    source_files:
      - "sys/kern/uipc_socket.c"
      - "sys/kern/uipc_sockbuf.c"
      - "sys/kern/uipc_usrreq.c"
      - "sys/kern/uipc_domain.c"
      - "sys/kern/uipc_accf.c"
      - "sys/sys/socketvar.h"
      - "sys/sys/protosw.h"
    # The wire protocols (TCP/UDP/IP) belong to the Transport and IP Layer
    # chapters; the packet path from the NIC belongs to Network Stack.
    # This chapter owns the socket abstraction that sits *above* protosw:
    # the struct socket, the two socket buffers, the protosw/domain
    # indirection, and AF_UNIX. Do not re-derive tcpcb/inpcb here.
    scope_guard: >
      This chapter owns the socket abstraction (struct socket, the two
      socket buffers, the protosw/pr_usrreqs indirection, and the
      UNIX-domain protocol). Do NOT re-explain TCP/UDP state machines or
      inpcb/tcpcb — those are the Transport chapter; here, protosw is the
      seam that connects a socket to whichever protocol backs it. Do NOT
      re-trace the NIC-to-netisr packet path (Network Stack chapter) — the
      socket buffer is where that path terminates on receive and
      originates on send. DO own file-descriptor passing over AF_UNIX
      (SCM_RIGHTS in uipc_usrreq.c), accept filters, and the sockbuf
      wakeup/select/kqueue interaction. Keep the userland socket API as
      framing; focus the prose on the in-kernel structures.
    focus: >
      Document the socket layer that sits between userland and the
      protocol stacks. Cover struct socket and its state, the two socket
      buffers (uipc_sockbuf.c: sbappend/sbreserve/sbwait, flow control,
      low-water marks, and how they wake select/poll/kqueue), and the
      protosw/domain indirection (uipc_domain.c) that lets one socket KPI
      (socket, bind, connect, send, recv, in uipc_socket.c) dispatch to
      TCP, UDP, UNIX-domain, or any registered address family via
      pr_usrreqs. Give UNIX-domain sockets (uipc_usrreq.c) first-class
      treatment: local stream/datagram/seqpacket transport and, crucially,
      passing file descriptors between processes via SCM_RIGHTS control
      messages. Cover accept filters (uipc_accf.c) as an example of the
      socket layer's extensibility. Frame the socket as the unifying IPC
      and network endpoint abstraction — the reason a program uses the same
      read()/write() on a pipe, a file, and a TCP connection.
    key_questions:
      - "What does struct socket hold, and how do the send and receive socket buffers (sbappend/sbreserve) implement flow control and wake up a blocked or kqueue-registered reader?"
      - "How does protosw/pr_usrreqs let the single socket KPI dispatch to TCP, UDP, or UNIX-domain without the socket code knowing the protocol?"
      - "How does SCM_RIGHTS pass a file descriptor between processes over a UNIX-domain socket, and what does the kernel do to the fd table on each side?"
      - "What is an accept filter, and how does it let the kernel defer handing a connection to userland until data has arrived?"
    mermaid: class

