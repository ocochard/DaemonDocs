      feeder chains and format conversion, vchan mixing, the mixer
      control layer, and how a hardware backend (HDA, USB audio) plugs
      in. Do NOT re-derive the cdevsw/make_dev machinery behind
      /dev/dsp* (Character Devices chapter) or newbus attachment (Device
      Driver Framework chapter) — reference both. Cover virtual_oss(8)
