    # nftables/tc and OpenBSD divert(4) solve narrower, differently-shaped
    # problems; a meaningful contrast would be its own essay rather than
    # a tacked-on Comparison section. Without this opt-out the writer
    # tends to invent weakly-grounded one-liners ("Linux uses tc instead
    # of netgraph") that mislead more than they explain.
    sections:
