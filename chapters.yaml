    # Keep source_files focused on the framework itself (ng_base.c is
    # the canonical entry point, netgraph.h is the KPI). The 70+ shipped
    # node modules under sys/netgraph/ are out of scope per scope_guard
    # — the writer can name a few in passing but should not catalog them.
    source_files:
