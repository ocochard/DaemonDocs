  - title: "NIC Drivers — from if_vr to iflib to if_cxgbe"
    family: "devices-interrupts"
    related:
      - "Device Driver Framework — newbus and devclass"
      - "Network Stack — Architecture and Packet Flow"
      - "Interrupt Handling — Threads, Filters, and Dispatch"
    output_file: "sys/dev/README_nic_drivers.md"
    source_dirs:
      - "sys/dev/vr"
      - "sys/dev/e1000"
      - "sys/dev/cxgbe"
    source_files:
      - "sys/dev/vr/if_vr.c"
      - "sys/net/iflib.h"
      - "sys/net/iflib.c"
      - "sys/dev/e1000/if_em.c"
      - "sys/dev/e1000/em_txrx.c"
      - "sys/dev/cxgbe/t4_main.c"
      - "sys/dev/cxgbe/adapter.h"
    focus: >
      Compare four points on the FreeBSD NIC-driver complexity
      spectrum, deliberately isolating the iflib variable. Start with
      **if_vr** (VIA Rhine, 100 Mbps, ~2600 lines, pre-iflib): a
      complete non-iflib driver — newbus attach/detach, mii PHY
      attach, tx/rx descriptor rings managed by hand with bus_dma,
      interrupt handler, watchdog timer, ifnet up/down. This is what
      "everything a NIC driver must do" looks like with no framework
      hiding it. Next, **if_em** (Intel 1 Gbps): same hardware
      generation as if_vr's contemporaries, but rewritten as an iflib
      consumer — show what iflib subtracts. The driver now provides a
      small set of device-specific methods (txd_encap, rxd_pkt_get,
      ift_softc state) and iflib owns queues, polling, NUMA buffer
      pools, multi-queue dispatch, and netmap integration. Then dive
      into **iflib itself** (sys/net/iflib.c, ~6000 lines): why
      FreeBSD pushed all of that common code up out of individual
      drivers, what abstractions it imposes (tx/rx queues, descriptor
      rings, IFLIB_INTR_RX semantics, dma tag management). Finally
      **if_cxgbe** (Chelsio T4/T5/T6, 10/25/40/100 Gbps): a non-iflib
      driver by *necessity* — the chip exposes TOE, RDMA, crypto
      offload, and NVMe-over-fabrics in addition to plain NIC mode,
      and iflib's queue/ring model can't express the hardware's
      partitioned multi-role design. Use this contrast (vr non-iflib
      because iflib didn't exist yet; cxgbe non-iflib because iflib
      isn't enough) to make the iflib trade-off concrete.
    key_questions:
      - "What does if_vr have to do that if_em no longer does — exactly which mechanics (descriptor ring management, DMA tag setup, interrupt handler structure, ifnet wiring) did iflib absorb?"
      - "What concrete callbacks does an iflib-based driver like if_em provide, and how does the iflib core invoke them on each tx and rx path?"
      - "How do tx and rx descriptor rings flow through iflib — from a driver mbuf-encap call down to a hardware ring write, and from interrupt back up to ether_input?"
      - "Why is if_cxgbe NOT an iflib driver? Which features of the Chelsio hardware (TOE, multi-queue with NIC/TOE/RDMA partitioning, hardware filters) make iflib's abstractions unsuitable, in contrast to if_vr (which is pre-iflib) vs if_em (which is iflib-fitted)?"
    mermaid: class

  - title: "DMA and busdma — Tags, Maps, and Bounce Buffers"
    family: "devices-interrupts"
    related:
      - "Device Driver Framework — newbus and devclass"
      - "NIC Drivers — from if_vr to iflib to if_cxgbe"
      - "mbuf — Network Buffer Allocation and Chaining"
    output_file: "sys/kern/README_busdma.md"
    source_dirs:
      - "sys/kern"
      - "sys/x86/x86"
      - "sys/arm64/arm64"
    # subr_bus_dma.c is the machine-independent busdma KPI
    # (bus_dmamap_load_mbuf/uio and the callback plumbing);
    # subr_busdma_bounce.c holds the shared bounce-buffer logic. The
    # per-arch backends (x86/x86/busdma_bounce.c + busdma_machdep.c,
    # arm64/arm64/busdma_bounce.c + busdma_machdep.c) implement
    # bus_dma_tag_create / bus_dmamap_load / bus_dmamap_sync for that
    # architecture. bus_dma.h is the KPI header every driver includes.
    source_files:
      - "sys/kern/subr_bus_dma.c"
      - "sys/kern/subr_busdma_bounce.c"
      - "sys/x86/x86/busdma_bounce.c"
      - "sys/x86/x86/busdma_machdep.c"
      - "sys/arm64/arm64/busdma_machdep.c"
      - "sys/sys/bus_dma.h"
    # newbus resource allocation (bus_alloc_resource for IRQ/memory/ports)
    # is a *sibling* subject owned by the Device Driver Framework chapter;
    # busdma is specifically the DMA-addressability problem. Do not
    # re-explain rman or resource activation here. mbuf loading
    # (bus_dmamap_load_mbuf_sg) touches the mbuf chapter — reference it.
    scope_guard: >
      This chapter owns the busdma framework: DMA tags, maps, bounce
      buffers, and synchronization. Do NOT re-explain newbus resource
      allocation (bus_alloc_resource, rman, IRQ/BAR activation) — that is
      the Device Driver Framework chapter; busdma is only about making
      buffers DMA-addressable. Do NOT re-derive the mbuf structure — when
      covering bus_dmamap_load_mbuf_sg, reference the mbuf chapter. Keep
      per-architecture detail to what illuminates the abstraction (why an
      IOMMU or a 32-bit-only device forces bouncing); do not turn it into
      an x86-vs-arm64 IOMMU tour.
    focus: >
      Explain the busdma abstraction that lets a driver hand a buffer to
      hardware for DMA safely and portably. Cover the DMA tag
      (bus_dma_tag_create: alignment, boundary, address-width, and
      segment constraints that describe what the device can address), the
      DMA map (bus_dmamap_create/load and the scatter/gather
      bus_dma_segment_t list a load produces), and the callback model for
      deferred loads. Explain bounce buffers: when a buffer's physical
      address is unreachable by the device (a 32-bit DMA engine on a
      64-bit machine, or alignment/boundary violations), busdma copies
      through an intermediate buffer, and bus_dmamap_sync
      (PREREAD/POSTREAD/PREWRITE/POSTWRITE) is what makes that copy — and
      cache coherency on architectures that need it — correct. Contrast
      the machine-independent KPI in subr_bus_dma.c with the per-arch
      backends, and show the common mbuf and uio load helpers that
      network and character drivers actually call.
    key_questions:
      - "What does a DMA tag describe, and how do its constraints (address width, alignment, boundary, max segments) determine whether a buffer can be DMA'd directly or must be bounced?"
      - "What is a bounce buffer, and what sequence of bus_dmamap_sync calls makes a bounced transfer correct on both read and write?"
      - "Why must even a cache-coherent x86 driver call bus_dmamap_sync, and what does the same call do differently on an architecture without DMA cache coherency?"
      - "How does bus_dmamap_load_mbuf_sg turn an mbuf chain into a scatter/gather segment list a NIC's descriptor ring can consume?"
    mermaid: sequence

  - title: "Callouts, Taskqueues, and Kernel Time — Deferred Execution"
    family: "devices-interrupts"
    related:
      - "Interrupt Handling — Threads, Filters, and Dispatch"
      - "Locking Primitives — Mutexes, sx, rmlocks, and Atomics"
      - "Device Driver Framework — newbus and devclass"
    output_file: "sys/kern/README_defer.md"
    source_dirs:
      - "sys/kern"
      - "sys/sys"
    # kern_timeout.c is the callout wheel (callout_reset/stop, the
    # per-CPU callout wheels driven by hardclock); subr_taskqueue.c is
    # the taskqueue mechanism (deferring work to a thread context where
    # sleeping is allowed); subr_eventhandler.c is the EVENTHANDLER
    # publish/subscribe framework; kern_clock.c/kern_tc.c/
    # kern_clocksource.c are the timekeeping + tick machinery that drives
    # callouts and accounting.
    source_files:
      - "sys/kern/kern_timeout.c"
      - "sys/kern/subr_taskqueue.c"
      - "sys/kern/subr_eventhandler.c"
      - "sys/kern/kern_clock.c"
      - "sys/kern/kern_tc.c"
      - "sys/kern/kern_clocksource.c"
      - "sys/sys/callout.h"
      - "sys/sys/taskqueue.h"
    # Interrupt threads/filters themselves are the Interrupt chapter's
    # subject; this chapter is about deferring work *out of* interrupt or
    # time-critical context. The sleepqueue/wakeup primitives belong to
    # Locking. Reference both; don't re-derive them.
    scope_guard: >
      This chapter owns deferred and time-driven execution: the callout
      wheel, taskqueues, EVENTHANDLER, and the timekeeping tick that
      drives them. Do NOT re-explain interrupt filters vs ithreads
      (Interrupt Handling chapter) — this is about work deferred *out of*
      those contexts. Do NOT re-derive sleepqueue/msleep (Locking
      chapter). Cover timekeeping (timecounters, hardclock/statclock,
      one-shot vs periodic clocksources) only far enough to explain what
      advances a callout and what times out a sleep; a full NTP/timecounter
      treatment is out of scope. Emphasize the practical decision: callout
      vs taskqueue vs direct ithread work, and the locking/race pitfalls of
      each (the classic callout_stop-vs-callout_drain race).
    focus: >
      Explain the mechanisms FreeBSD kernel code uses to run work later or
      in a safer context. Callouts (kern_timeout.c): the per-CPU callout
      wheels, callout_reset/callout_stop/callout_drain, direct vs
      deferred callouts, and the notorious teardown races. Taskqueues
      (subr_taskqueue.c): deferring work from an interrupt filter or a
      non-sleepable context into a thread where locking and sleeping are
      allowed — FreeBSD's answer to Linux's softirq/workqueue split.
      EVENTHANDLER (subr_eventhandler.c): the in-kernel publish/subscribe
      hooks (shutdown, process exit, mountroot, low-memory) that let
      subsystems react to lifecycle events without hard-coding callers.
      And the timekeeping substrate (kern_clock.c, kern_tc.c,
      kern_clocksource.c): timecounters, hardclock/statclock ticks, and
      one-shot event timers — the heartbeat that fires callouts and drives
      time accounting.
    key_questions:
      - "When should a driver use a callout, a taskqueue, or direct ithread work — what does each cost and what context does each run in?"
      - "What is the callout_stop-versus-callout_drain race, and why can stopping a callout that has already begun executing corrupt a driver's state?"
      - "Why does deferring work to a taskqueue let code sleep or take an sx lock that it could not take in an interrupt filter?"
      - "What advances a callout and charges CPU time to a thread — how do hardclock/statclock and the timecounter machinery drive the deferred-execution and accounting systems?"
    mermaid: state

  - title: "Character Devices and the TTY Layer — cdev, devfs, and terminals"
    family: "devices-interrupts"
    related:
      - "Device Driver Framework — newbus and devclass"
      - "VFS — Virtual File System Layer"
      - "Signals, kqueue, and IPC — Process Communication and Notification"
    output_file: "sys/kern/README_cdev.md"
    source_dirs:
      - "sys/kern"
      - "sys/fs/devfs"
      - "sys/sys"
    # kern_conf.c owns make_dev/destroy_dev and the cdevsw registration;
    # subr_uio.c is uiomove (the copyin/copyout engine every d_read/d_write
    # uses); fs/devfs/* is the filesystem that exposes cdevs as /dev nodes;
    # tty.c is the TTY core, tty_ttydisc.c the line discipline,
    # tty_pts.c the pseudo-terminal driver, tty_inq.c/tty_outq.c the tty
    # buffers. conf.h/tty.h are the KPIs.
    source_files:
      - "sys/kern/kern_conf.c"
      - "sys/kern/subr_uio.c"
      - "sys/fs/devfs/devfs_devs.c"
      - "sys/fs/devfs/devfs_vnops.c"
      - "sys/kern/tty.c"
      - "sys/kern/tty_ttydisc.c"
      - "sys/kern/tty_pts.c"
      - "sys/sys/conf.h"
      - "sys/sys/tty.h"
    # newbus attaches devices; this chapter is about how a driver exposes
    # a /dev node and the read/write/ioctl interface on it. devfs is a
    # filesystem but its vnode ops belong here (as the cdev face), not in
    # the VFS chapter — reference VFS for the generic vnode contract.
    # Signals from the tty (job control, SIGINT/SIGTSTP) connect to the
    # IPC chapter — reference it.
    scope_guard: >
      This chapter owns the character-device abstraction (cdevsw,
      make_dev, the d_open/d_read/d_write/d_ioctl/d_poll/d_kqfilter
      methods, uiomove), devfs as the /dev face of cdevs, and the TTY
      layer (core, line discipline, ptys). Do NOT re-explain newbus device
      attachment (Device Driver Framework chapter) — a cdev is what a
      driver *exposes*, not how it attaches. Do NOT re-derive the generic
      vnode/VOP contract (VFS chapter); cover only devfs's cdev-specific
      vnode ops. Terminal-driven signals (job control, SIGINT/SIGTSTP/
      SIGTTOU) connect to the Signals/IPC chapter — reference it rather
      than re-explaining signal delivery. Block devices are gone in modern
      FreeBSD — say so once and move on.
    focus: >
      Explain how a driver presents itself to userland as a device node
      and how terminals work. The cdev half: struct cdevsw and the d_*
      method table, make_dev/destroy_dev, the /dev node lifecycle, and
      uiomove (subr_uio.c) as the copyin/copyout engine behind every
      d_read/d_write. devfs (fs/devfs): how it materializes cdevs as a
      kernel-populated filesystem, cloning, and per-jail /dev visibility.
      The TTY half: the tty core (tty.c), the line discipline
      (tty_ttydisc.c) that turns raw byte streams into canonical lines and
      handles echo, the input/output queues, session/controlling-terminal
      and job-control semantics (which terminal-generated signals like
      SIGINT and SIGTSTP flow from), and pseudo-terminals (tty_pts.c) that
      back sshd, xterm, and script(1). Frame the cdev as the second half
      of driver authorship — newbus attaches the hardware, the cdev
      exposes it.
    key_questions:
      - "What does make_dev create, and how do the cdevsw d_* methods (d_open/d_read/d_write/d_ioctl/d_kqfilter) get invoked when userland opens and reads a /dev node?"
      - "How does devfs differ from an ordinary filesystem — where do the /dev entries come from, and how does per-jail devfs visibility work?"
      - "What does the TTY line discipline do to a byte stream in canonical mode, and how does it generate job-control signals to the foreground process group?"
      - "How does a pseudo-terminal pair (pts) let sshd or xterm present a real terminal to a shell that has no physical serial line behind it?"
    mermaid: class

