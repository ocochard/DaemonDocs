      - "What is netisr and why does FreeBSD use network threads?"
      - "How are socket buffers (sbappend/sbreserve) managed?"
    mermaid: sequence

  - title: "VNET — Virtual Network Stacks"
    output_file: "sys/net/README_vnet.md"
    source_dirs:
      - "sys/net"
    source_files:
      - "sys/net/vnet.c"
      - "sys/net/vnet.h"
    focus: >
      Document VNET, FreeBSD's per-jail network-stack virtualization.
      VNET turns nearly every global in the network stack — ifnet
      lists, routing tables, pf/ipfw rule sets, TCP/UDP PCB hashes,
      net.* sysctl values — into a per-vnet instance, so a vnet jail
      sees a completely independent network world. Cover the
      VNET_DEFINE / VNET / CURVNET_SET machinery, how vnet context is
      switched on every packet entering or leaving a jail, the
      destruction protocol (deferred teardown), and the cost model
      (memory per vnet, sysctl overhead). Distinguish from chapter 12
      (jail process isolation) — VNET is the network half.
    key_questions:
      - "What does VNET_DEFINE actually expand to, and how is per-vnet storage laid out at link time?"
      - "How does CURVNET_SET / CURVNET_RESTORE switch the vnet context on a per-packet basis without locking overhead?"
      - "What is the relationship between a jail and a vnet — when does a jail get its own vnet, and when does it share the host's?"
      - "How is a vnet torn down safely when its jail is destroyed, given that mbufs and timers may still reference its state?"
    mermaid: class

  - title: "pf — OpenBSD-derived Packet Filter"
    output_file: "sys/netpfil/pf/README.md"
    source_dirs:
      - "sys/netpfil/pf"
    source_files:
      - "sys/netpfil/pf/pf.c"
      - "sys/netpfil/pf/pf_ioctl.c"
      - "sys/netpfil/pf/pf_lb.c"
      - "sys/netpfil/pf/pf_norm.c"
      - "sys/netpfil/pf/pf.h"
      - "sys/netpfil/pf/if_pfsync.c"
      - "sys/netpfil/pf/if_pflog.c"
    focus: >
      Document pf, FreeBSD's OpenBSD-derived packet filter. Cover how
      pf attaches to the netpfil pfil_hook framework (the same hook
      points ipfw uses, see ipfw chapter), pf's rule evaluation model,
      the state table, NAT, normalization (scrub), the if_pfsync
      state-replication protocol used in HA pairs, and if_pflog.
      Explain pf's last-matching-rule-wins semantics and the role of
      "quick" rules.
    key_questions:
      - "What is a pfil hook, and how does pf register itself into the IP input/output paths from chapter 9?"
      - "How is pf's state table structured, and what does a stateful rule actually create?"
      - "How does pfsync replicate state to a peer, and what makes a pf+CARP cluster work?"
      - "What does scrub do, and why is normalization done before filtering?"
    mermaid: flowchart

  - title: "ipfw and dummynet — FreeBSD's Native Firewall"
    output_file: "sys/netpfil/ipfw/README.md"
    source_dirs:
      - "sys/netpfil/ipfw"
    source_files:
      - "sys/netpfil/ipfw/ip_fw2.c"
      - "sys/netpfil/ipfw/ip_fw_dynamic.c"
      - "sys/netpfil/ipfw/ip_fw_table.c"
      - "sys/netpfil/ipfw/ip_fw_nat.c"
      - "sys/netpfil/ipfw/ip_dummynet.c"
      - "sys/netpfil/ipfw/ip_dn_io.c"
    focus: >
      Document ipfw, FreeBSD's native firewall, and dummynet, the
      traffic-shaper/AQM subsystem ipfw drives. Cover how ipfw attaches
      to the same netpfil pfil_hook framework as pf, ipfw's
      first-matching-rule-wins semantics (opposite of pf), the rule
      tables (in_kernel hash/radix), dynamic state, in-kernel NAT, and
      the divert/tee/skipto control flow primitives. Then cover
      dummynet: pipes, queues, schedulers (FIFO, WF2Q+, FQ-CoDel,
      FQ-PIE), and how a packet matched by an ipfw rule is enqueued,
      shaped, and re-injected. Contrast with pf throughout.
    key_questions:
      - "How does ipfw's first-matching-rule-wins semantics differ from pf's last-match, and what does that imply for rule design?"
      - "How does dummynet implement traffic shaping — what is the path from an ipfw 'pipe' rule through to a scheduler dequeue?"
      - "What is in-kernel NAT in ipfw (libalias-based), and how does it differ from pf's NAT?"
      - "When does FreeBSD load both pf and ipfw simultaneously, and how do their pfil hook orderings interact?"
    mermaid: flowchart

