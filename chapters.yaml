# FreeBSD Internals — Chapter Configuration
# Each chapter is one agent run that produces a README file.
#
# Fields:
#   title        — chapter heading
#   family       — group tag used as the fallback for the "Related" sidebar
#                  when `related:` is not set. Chapters with the same family
#                  are considered related by default. Current values:
#                    boot-kernel-core, memory-process, storage-io,
#                    networking, devices-interrupts, security-isolation,
#                    virt-observability
#   related      — optional list of titles to use for the "Related" sidebar
#                  and "See Also" cross-links instead of the family default.
#                  Use this when family-mates aren't enough or include too
#                  much (cross-family edges, narrowing a 6-chapter family).
#                  Titles must match the `title:` field exactly.
#   output_file  — where to write (relative to FreeBSD src root)
#   source_dirs  — directories the agent should explore
#   source_files — specific files the agent should examine
#   extra_search_dirs — optional list of directories (relative to the
#                  FreeBSD src root) to add to the fact-check grep root
#                  in addition to `sys/`. Use for chapters whose subject
#                  legitimately lives outside the kernel proper — the
#                  Boot Process chapter (stand/efi/loader) is the
#                  canonical case: without it, real symbols like
#                  `EFI_MEMORY_DESCRIPTOR`, `preloaded_file`,
#                  `elf64_exec` get flagged as missing because
#                  `_verify_structs`/`_verify_functions` only search
#                  `sys/` by default.
#   focus        — what aspect to emphasize
#   key_questions — questions the chapter must answer
#   mermaid      — what diagram to include (sequence / flowchart / class / state)

chapters:
  - title: "Source Tree — Layout and Conventions"
    family: "boot-kernel-core"
    related:
      - "Kernel Core — Structure and Entry Point"
      - "Build System — buildworld and buildkernel"
    # NOTE: output is README_internals.md, not README.md — upstream FreeBSD
    # already ships a README.md at the tree root (and we read it as a source
    # file below). Writing there would clobber upstream and cause a
    # read-vs-write collision in run_chapter().
    output_file: "README_internals.md"
    # This chapter is a tree-level overview — there's no specific subsystem
    # to feature with structs or a code walkthrough, so we drop those two
    # sections. Per-chapter section selection lets each chapter declare
    # what's actually appropriate; see _SECTION_CATALOG in generate-doc.py
    # for the full set.
    sections:
      - "Quick Summary"
      - "Architecture"
      - "Flow / Diagram"
      - "Advanced Notes"
      - "See Also"
    # Tree-overview scope. Without this guard the writer pulls struct
    # snippets and code walks from sys/vm and sys/kern into the main
    # README, which then duplicates (and often contradicts) the
    # subsystem-specific chapters. Keep it strictly directory-purpose.
    #
    # Build-system carve-out: chapter 4 ("Build System — buildworld and
    # buildkernel") owns *how* the build works (Makefile.inc1, share/mk
    # rules, build phases, src.conf options, kernel config processing,
    # cross-compilation). This chapter owns *what lives where* in the
    # source tree. Without the explicit guard below, both chapters end
    # up walking through `make buildworld` phases — observed 2026-04-30
    # on the buildworld-flow key_question.
    scope_guard: >
      This is a tree-level overview. Do NOT feature specific subsystem
      structs (vm_page, vm_map, struct proc, struct vnode, struct
      vm_pagequeue, etc.) or code from inside sys/vm, sys/kern, etc.
      Those belong to their own chapters. When you mention sys/vm or
      sys/kern, give a one-sentence directory-purpose only and refer the
      reader to the relevant chapter. No struct field-by-field tables,
      no function-body excerpts, no #include details.

      Do NOT explain *how* the build system works — Makefile.inc1, the
      share/mk rule library, build phases (bootstrap tools, cross-tools,
      libraries, userland, kernel), src.conf(5) options, dependency
      tracking, out-of-tree builds, kernel config processing, and cross-
      compilation all belong to the Build System chapter (share/mk/README.md).
      You may mention that `make buildworld` exists, name the top-level
      Makefile, and link to the Build System chapter for details — but
      do NOT walk through the buildworld flow, do NOT enumerate the
      bsd.*.mk files, and do NOT show Makefile snippets here.
    source_dirs: []
    source_files:
      - "README.md"
      - "Makefile"
      - "UPDATING"
    focus: >
      Map the FreeBSD source tree layout: the directory taxonomy and the
      principle that source location mirrors install path. Cover the roles
      of bin/, sbin/, usr.bin/, usr.sbin/, lib/, sys/, stand/, contrib/,
      gnu/, cddl/, share/, rescue/, and tests/. Explain the licensing
      groups (base BSD code vs contrib/gnu/cddl). The *how* of the build
      itself is the Build System chapter's job — only point at it from here.
    key_questions:
      - "What lives in each top-level directory, and why?"
      - "What is the separation between base system and contrib/gnu/cddl code?"
      - "How are architecture-specific files organized under sys/ and stand/?"
    mermaid: flowchart

  - title: "Boot Process — UEFI Bootloader to Kernel Handoff"
    family: "boot-kernel-core"
    related:
      - "Kernel Core — Structure and Entry Point"
      - "Build System — buildworld and buildkernel"
    output_file: "stand/efi/loader/README.md"
    source_dirs:
      - "stand/efi/loader"
      - "stand/efi/loader/arch/amd64"
      - "stand/efi/loader/arch/arm64"
    source_files:
      - "stand/efi/loader/arch/amd64/elf64_freebsd.c"
      - "stand/efi/loader/arch/arm64/exec.c"
      - "stand/efi/loader/bootinfo.c"
    # The bootloader lives under stand/, not sys/. Without this, real
    # symbols (EFI_MEMORY_DESCRIPTOR, preloaded_file, elf64_exec,
    # bi_load, file_metadata) get falsely flagged as missing by the
    # fact-check pass and the fact-fix loop tells the writer to
    # "remove or correct" symbols that are actually correct.
    extra_search_dirs:
      - "stand"
    focus: >
      Document how loader.efi loads the kernel, passes the EFI memory map,
      and hands off control. Compare x86_64 and ARM64 boot metadata mechanisms.
    key_questions:
      - "How does the bootloader pass the memory map to the kernel?"
      - "What is struct bootinfo / bi_module and how is it used?"
      - "Why is the EFI memory map critical for VM initialization?"
    mermaid: sequence

  - title: "Kernel Core — Structure and Entry Point"
    family: "boot-kernel-core"
    related:
      - "Source Tree — Layout and Conventions"
      - "Boot Process — UEFI Bootloader to Kernel Handoff"
      - "Process Management — Scheduling and Lifecycle"
    output_file: "sys/README.md"
    source_dirs:
      - "sys/kern"
      - "sys/amd64/amd64"
      - "sys/arm64/arm64"
    source_files:
      - "sys/kern/init_main.c"
      - "sys/amd64/amd64/locore.S"
      - "sys/amd64/amd64/machdep.c"
      - "sys/arm64/arm64/locore.S"
      - "sys/sys/kernel.h"
    focus: >
      Trace kernel startup from _start through cpu_startup to init_main.
      Explain SI_SUB ordering, how subsystems are initialized, and the
      difference between early boot and userland bootstrap.
    key_questions:
      - "What happens between the last instruction of the bootloader and the first userland process?"
      - "How does the sysinit framework organize initialization?"
      - "What is the role of locore.S on each architecture?"
    mermaid: sequence

  - title: "Build System — buildworld and buildkernel"
    family: "boot-kernel-core"
    related:
      - "Boot Process — UEFI Bootloader to Kernel Handoff"
      - "Source Tree — Layout and Conventions"
    output_file: "share/mk/README.md"
    source_dirs:
      - "share/mk"
      - "tools/build"
    source_files:
      - "Makefile.inc1"
      - "share/mk/bsd.sys.mk"
      - "share/mk/bsd.kmod.mk"
      - "share/mk/bsd.prog.mk"
    # Companion guard to chapter 1 (Source Tree). The directory taxonomy
    # — what lives in bin/, sbin/, usr.bin/, lib/, contrib/, gnu/, etc.
    # — is owned by README_internals.md. Without this guard, the writer
    # restates the taxonomy here as preamble to "and then make builds
    # them," which duplicates ~half of chapter 1.
    scope_guard: >
      This chapter is about *how* the build orchestrates compilation, not
      *where* the source code lives. Do NOT enumerate the directory
      taxonomy (bin/ for system commands, sbin/ for system admin, lib/
      for libraries, contrib/ for third-party code, etc.) — that belongs
      to the Source Tree chapter (README_internals.md). When you need to
      reference where a category of source lives, give it a single phrase
      and link to the Source Tree chapter. Focus your prose on the
      Makefile hierarchy, share/mk rule files, build phases and their
      ordering, src.conf(5) options, kernel config processing, cross-
      compilation, dependency tracking, and out-of-tree builds.
    focus: >
      Explain how FreeBSD builds: the Makefile hierarchy, .conf files,
      options handling, and the difference between buildworld and buildkernel.
      Cover the staging areas and dependency tracking.
    key_questions:
      - "How does 'make buildworld' orchestrate the full build?"
      - "What is the role of Makefile.inc1?"
      - "How are kernel .conf files processed into source sets?"
    mermaid: flowchart
    # Drop Comparison: the FreeBSD build system (Makefile.inc1, share/mk
    # rule files, src.conf(5)) has no real cross-OS analog at the level of
    # detail this chapter operates at. Linux uses Kbuild/Kconfig, NetBSD
    # uses a similar bsd.*.mk family, but a meaningful contrast would be
    # its own chapter — not a tacked-on Comparison. Without this opt-out,
    # the writer fills space with weakly-grounded one-liners.
    sections:
      - "Quick Summary"
      - "Architecture"
      - "Key Data Structures"
      - "Deep Dive"
      - "Flow / Diagram"
      - "Advanced Notes"
      - "See Also"

  - title: "Virtual Memory Subsystem — vm_page, UMA, and Pagers"
    family: "memory-process"
    related:
      - "Kernel Core — Structure and Entry Point"
      - "Buffer Cache — Block I/O Subsystem"
      - "VFS — Virtual File System Layer"
    output_file: "sys/vm/README.md"
    source_dirs:
      - "sys/vm"
      - "sys/amd64/amd64"
    source_files:
      - "sys/vm/vm_page.c"
      - "sys/vm/vm_map.c"
      - "sys/vm/vm_object.c"
      - "sys/vm/vm_fault.c"
      - "sys/vm/pmap.h"
      - "sys/amd64/amd64/pmap.c"
    focus: >
      Explain the FreeBSD VM architecture: vm_map entries, vm_objects,
      vm_pages, and the pmap layer. Cover page faults, virtual-to-physical
      translation, and the buddy allocator.
    key_questions:
      - "How does FreeBSD organize virtual address spaces?"
      - "What is the relationship between vm_map, vm_object, and vm_page?"
      - "How does the pmap layer abstract hardware page tables?"
    # The Deep Dive walks through page-fault handling — a sequence of
    # events between CPU, vm_fault, the pager, and the pmap layer — so a
    # sequence diagram tells that story better than the class diagram.
    # The class structure (vm_map → vm_map_entry → vm_object → vm_page) is
    # already conveyed by the Key Data Structures section's struct quotes.
    mermaid: sequence
    # Glossary is opt-in per chapter (not in _DEFAULT_SECTIONS). VM uses
    # heavy jargon — TLB shootdown, PML4, copy-on-write, slab, shadow
    # chain — that students need defined up front, before the Architecture
    # section starts using the terms.
    sections:
      - "Quick Summary"
      - "Glossary"
      - "Architecture"
      - "Key Data Structures"
      - "Deep Dive"
      - "Flow / Diagram"
      - "Advanced Notes"
      - "Comparison"
      - "See Also"

  - title: "Process Management — Scheduling and Lifecycle"
    family: "memory-process"
    related:
      - "Kernel Core — Structure and Entry Point"
      - "Interrupt Handling — Threads, Filters, and Dispatch"
      - "Locking Primitives — Mutexes, sx, rmlocks, and Atomics"
      - "Jails — OS-level Isolation"
    output_file: "sys/kern/README_process.md"
    source_dirs:
      - "sys/kern"
    source_files:
      - "sys/kern/kern_fork.c"
      - "sys/kern/kern_exit.c"
      - "sys/kern/kern_thread.c"
      - "sys/kern/sched_4bsd.c"
      - "sys/kern/sched_ule.c"
    focus: >
      Cover process creation (fork/exec), the process struct (struct proc),
      thread representation (struct thread), and the 4BSD scheduler.
      Explain run queues, time slicing, and CPU assignment.
    key_questions:
      - "How does fork() create a new process in FreeBSD?"
      - "What is the relationship between proc and thread structures?"
      - "How does the 4BSD scheduler decide which thread runs next?"
    mermaid: sequence

  - title: "Locking Primitives — Mutexes, sx, rmlocks, and Atomics"
    family: "memory-process"
    related:
      - "Process Management — Scheduling and Lifecycle"
      - "Interrupt Handling — Threads, Filters, and Dispatch"
      - "Kernel Core — Structure and Entry Point"
    output_file: "sys/kern/README_locking.md"
    source_dirs:
      - "sys/kern"
      - "sys/sys"
    source_files:
      - "sys/kern/kern_mutex.c"
      - "sys/kern/kern_rwlock.c"
      - "sys/kern/kern_sx.c"
      - "sys/kern/kern_lock.c"
      - "sys/kern/subr_turnstile.c"
      - "sys/kern/subr_sleepqueue.c"
      - "sys/kern/subr_witness.c"
      - "sys/sys/mutex.h"
      - "sys/sys/rwlock.h"
      - "sys/sys/sx.h"
    focus: >
      Document the FreeBSD kernel locking toolkit. Cover the four main
      primitives — spin/sleep mutex (mtx), reader/writer lock (rwlock),
      shared/exclusive lock (sx), and lockmgr (legacy, used by VFS) —
      explaining when each is appropriate and what guarantees each
      provides. Cover the priority-propagation machinery (turnstiles)
      that prevents priority inversion on contended sleep mutexes, the
      sleep-queue mechanism that backs sx and condvar/msleep, and the
      WITNESS lock-order verifier. This subsystem cuts across every
      other chapter — readers hit mtx_lock everywhere and need a
      single place to understand what it actually does.
    key_questions:
      - "When should a developer reach for a mutex vs an sx vs a rwlock — what trade-off does each express?"
      - "What is a turnstile, and how does priority propagation defeat priority inversion on a contended mtx?"
      - "How does WITNESS detect lock-order reversals, and why is that a runtime check rather than a static one?"
      - "What is the difference between a spin mutex and a sleep mutex, and which contexts force you to use a spin mutex?"
    mermaid: class

  - title: "Buffer Cache — Block I/O Subsystem"
    family: "storage-io"
    related:
      - "Virtual Memory Subsystem — vm_page, UMA, and Pagers"
      - "VFS — Virtual File System Layer"
      - "GEOM — Storage Framework"
      - "UFS — FreeBSD's Native Filesystem"
    output_file: "sys/vm/README_bcache.md"
    source_dirs:
      - "sys/kern"
      - "sys/sys"
    source_files:
      - "sys/kern/vfs_bio.c"
      - "sys/kern/vfs_cluster.c"
      - "sys/sys/buf.h"
    focus: >
      Explain the buffer cache (buf), its relationship to the VM system,
      and how disk I/O flows from VFS through the buffer cache to bio
      providers. Cover bufstate, dirty buffers, and writeback.
    key_questions:
      - "What is the struct buf and how does it cache disk blocks?"
      - "How does the buffer cache interact with the VM page cache?"
      - "What happens when a dirty buffer is written back to disk?"
    mermaid: flowchart

  - title: "GEOM — Storage Framework"
    family: "storage-io"
    related:
      - "Buffer Cache — Block I/O Subsystem"
      - "CAM — Common Access Method Storage Stack"
      - "ZFS — Pooled Storage and Copy-on-Write Filesystem"
    output_file: "sys/geom/README.md"
    source_dirs:
      - "sys/geom"
    source_files:
      - "sys/geom/geom.h"
      - "sys/geom/geom_subr.c"
      - "sys/geom/geom_io.c"
      - "sys/geom/geom_dev.c"
      - "sys/geom/geom_disk.c"
      - "sys/geom/geom_vfs.c"
      - "sys/geom/geom_event.c"
      - "sys/geom/geom_slice.c"
    focus: >
      Document the GEOM stackable storage framework that sits between the
      buffer cache / VFS layer and physical device drivers. Explain the
      provider/consumer/class model, how bio requests are transformed and
      forwarded down the stack, the g_event thread, topology locking, and
      how GEOM classes (mirror, eli, part, label, etc.) compose to build
      transformations like RAID, encryption, and partitioning.
    key_questions:
      - "What are GEOM providers, consumers, and classes — and how does a class express a transformation?"
      - "How does a bio request travel down a GEOM stack from g_io_request to a disk driver, and back up via g_io_deliver?"
      - "Why does GEOM have a single-threaded g_event/topology model, and what is the topology lock protecting?"
      - "How does geom_vfs bridge VFS struct buf I/O into the GEOM bio world?"
    mermaid: flowchart

  - title: "CAM — Common Access Method Storage Stack"
    family: "storage-io"
    related:
      - "GEOM — Storage Framework"
      - "Device Driver Framework — newbus and devclass"
      - "Interrupt Handling — Threads, Filters, and Dispatch"
    output_file: "sys/cam/README.md"
    source_dirs:
      - "sys/cam"
      - "sys/cam/scsi"
      - "sys/cam/ata"
      - "sys/cam/nvme"
    source_files:
      - "sys/cam/cam.h"
      - "sys/cam/cam_ccb.h"
      - "sys/cam/cam_xpt.c"
      - "sys/cam/cam_periph.c"
      - "sys/cam/cam_sim.c"
      - "sys/cam/cam_iosched.c"
      - "sys/cam/scsi/scsi_da.c"
      - "sys/cam/scsi/scsi_all.c"
      - "sys/cam/ata/ata_da.c"
      - "sys/cam/nvme/nvme_all.c"
    focus: >
      Document CAM, the Common Access Method storage stack. CAM sits
      between GEOM (chapter 9 — bio requests on virtual storage
      providers) and the actual host bus adapter (HBA) drivers. Cover
      the three main pieces: the **transport (XPT)** that owns the
      bus/target/LUN topology and routes Command Control Blocks
      (CCBs); the **SIM** (SCSI Interface Module) layer — what an HBA
      driver actually implements; and the **peripheral drivers** (da
      for SCSI disks, ada for ATA disks, nda for NVMe namespaces, cd
      for optical, sa for tape) that turn a disk-shaped device into a
      GEOM provider. Cover the CCB lifecycle (allocation → XPT →
      SIM → device → completion), the cam_iosched I/O scheduler, and
      how SCSI/ATA/NVMe transports coexist under one CCB-based
      framework. Show how a read() on /dev/da0 traverses VFS → buffer
      cache → GEOM → CAM peripheral (da) → XPT → SIM → HBA driver.
    key_questions:
      - "What is a Command Control Block (union ccb), and how does its discriminated union represent SCSI, ATA, and NVMe commands uniformly?"
      - "What is the boundary between an HBA driver (the SIM) and the CAM XPT — what does the SIM owe XPT, and what does XPT do for the SIM?"
      - "How does a peripheral driver like da(4) attach to a target/LUN discovered by XPT, and how does it expose itself as a GEOM provider?"
      - "How does cam_iosched's I/O scheduling interact with GEOM-level queueing — who decides ordering, who decides concurrency?"
    mermaid: class

