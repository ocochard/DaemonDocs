  - title: "ZFS Filesystem"
    # Upstream OpenZFS ships its own README.md at sys/contrib/openzfs/ —
    # use a sibling name to avoid the read-vs-write collision.
    output_file: "sys/contrib/openzfs/README_freebsd.md"
    source_dirs:
      - "sys/contrib/openzfs/module/zfs"
      - "sys/contrib/openzfs/include/sys"
    source_files:
      - "sys/contrib/openzfs/module/zfs/arc.c"
      - "sys/contrib/openzfs/module/zfs/dmu.c"
      - "sys/contrib/openzfs/module/zfs/spa.c"
      - "sys/contrib/openzfs/module/zfs/vdev.c"
      - "sys/contrib/openzfs/module/zfs/zil.c"
      - "sys/contrib/openzfs/module/zfs/zio.c"
      - "sys/contrib/openzfs/module/zfs/zfs_vnops.c"
    focus: >
      Document the ZFS architecture as it ships in FreeBSD via OpenZFS.
      Cover the layered design: zpool/vdev (storage virtualization), SPA
      (storage pool allocator), DMU (data management unit, transactional
      object layer), DSL (dataset/snapshot layer), ZIL (intent log), ZIO
      (I/O pipeline), ARC (adaptive replacement cache), and the ZPL
      (POSIX layer that bridges into VFS). Explain copy-on-write,
      transaction groups, and how ZFS bypasses the buffer cache by
      caching in the ARC instead.
    key_questions:
      - "What is the layering from a userspace read() down through ZPL → DMU → ARC → ZIO → vdev?"
      - "How do transaction groups (txg) batch writes, and what triggers a txg sync?"
      - "Why does ZFS use the ARC instead of the FreeBSD buffer cache, and how does that interact with the VM page cache?"
      - "What is the role of the ZIL, and when is it actually written to (sync writes vs async)?"
    mermaid: class

