  - title: "NIC Drivers — from if_em to iflib to if_cxgbe"
    output_file: "sys/dev/README_nic_drivers.md"
    source_dirs:
      - "sys/dev/e1000"
      - "sys/dev/cxgbe"
    source_files:
      - "sys/net/iflib.h"
      - "sys/net/iflib.c"
      - "sys/dev/e1000/if_em.c"
      - "sys/dev/e1000/em_txrx.c"
      - "sys/dev/cxgbe/t4_main.c"
      - "sys/dev/cxgbe/adapter.h"
    focus: >
      Compare three points on the FreeBSD NIC-driver complexity
      spectrum, using each as a lens onto a different design choice.
      Start with **if_em** (Intel 1 Gbps) as a present-day iflib
      consumer — show how iflib reduces the driver to a small set of
      device-specific methods (txd_encap, rxd_pkt_get, etc.) and
      iflib_softc state, with the framework owning the queues, polling
      loop, and netmap integration. Then dive into **iflib itself**
      (sys/net/iflib.c, ~6000 lines): the abstractions it imposes —
      tx/rx queues, descriptor rings, multi-queue mapping, NUMA-aware
      buffer pools — and why FreeBSD pushed common code up out of
      individual drivers. Finally use **if_cxgbe** (Chelsio T4/T5/T6
      10/25/40/100 Gbps) as the case where iflib is *not* enough: it's
      a non-iflib driver because its hardware exposes far more
      capabilities (TOE, RDMA, crypto offload, NVMe-over-fabrics) than
      iflib's model accommodates. Show what a "complex" NIC driver
      looks like and why it earned its complexity.
    key_questions:
      - "What concrete callbacks does an iflib-based driver like if_em provide, and what does iflib do for it that the driver no longer has to?"
      - "How do tx and rx descriptor rings flow through iflib — from a driver mbuf-encap call down to a hardware ring write, and from interrupt back up to ether_input?"
      - "Why is if_cxgbe NOT an iflib driver? Which features of the Chelsio hardware (TOE, multi-queue with NIC/TOE/RDMA partitioning, hardware filters) make iflib's abstractions unsuitable?"
      - "What does t4_main.c attach actually do — how is the chip brought up, firmware loaded, and queues partitioned across NIC/offload roles?"
    mermaid: class

  - title: "Jails and System Isolation"
    output_file: "sys/kern/README_jail.md"
    source_dirs:
      - "sys/kern"
    source_files:
      - "sys/kern/kern_jail.c"
