# FreeBSD Internals — Chapter Configuration
# Each chapter is one agent run that produces a README file.
#
# Fields:
#   title        — chapter heading
#   family       — group tag used as the fallback for the "Related" sidebar
#                  when `related:` is not set. Chapters with the same family
#                  are considered related by default. Current values:
#                    boot-kernel-core, memory-process, storage-io,
#                    networking, devices-interrupts, security-isolation,
#                    virt-observability
#   related      — optional list of titles to use for the "Related" sidebar
#                  and "See Also" cross-links instead of the family default.
#                  Use this when family-mates aren't enough or include too
#                  much (cross-family edges, narrowing a 6-chapter family).
#                  Titles must match the `title:` field exactly.
#   output_file  — where to write (relative to FreeBSD src root)
#   source_dirs  — directories the agent should explore
#   source_files — specific files the agent should examine
#   extra_search_dirs — optional list of directories (relative to the
#                  FreeBSD src root) to add to the fact-check grep root
#                  in addition to `sys/`. Use for chapters whose subject
#                  legitimately lives outside the kernel proper — the
#                  Boot Process chapter (stand/efi/loader) is the
#                  canonical case: without it, real symbols like
#                  `EFI_MEMORY_DESCRIPTOR`, `preloaded_file`,
#                  `elf64_exec` get flagged as missing because
#                  `_verify_structs`/`_verify_functions` only search
#                  `sys/` by default.
#   focus        — what aspect to emphasize
#   key_questions — questions the chapter must answer
#   mermaid      — what diagram to include (sequence / flowchart / class / state)

chapters:
  - title: "Source Tree — Layout and Conventions"
    family: "boot-kernel-core"
    related:
      - "Kernel Core — Structure and Entry Point"
      - "Build System — buildworld and buildkernel"
    # NOTE: output is README_internals.md, not README.md — upstream FreeBSD
    # already ships a README.md at the tree root (and we read it as a source
    # file below). Writing there would clobber upstream and cause a
    # read-vs-write collision in run_chapter().
    output_file: "README_internals.md"
    # This chapter is a tree-level overview — there's no specific subsystem
    # to feature with structs or a code walkthrough, so we drop those two
    # sections. Per-chapter section selection lets each chapter declare
    # what's actually appropriate; see _SECTION_CATALOG in generate-doc.py
    # for the full set.
    sections:
      - "Quick Summary"
      - "Architecture"
      - "Flow / Diagram"
      - "Advanced Notes"
      - "See Also"
    # Tree-overview scope. Without this guard the writer pulls struct
    # snippets and code walks from sys/vm and sys/kern into the main
    # README, which then duplicates (and often contradicts) the
    # subsystem-specific chapters. Keep it strictly directory-purpose.
    #
    # Build-system carve-out: chapter 4 ("Build System — buildworld and
    # buildkernel") owns *how* the build works (Makefile.inc1, share/mk
    # rules, build phases, src.conf options, kernel config processing,
    # cross-compilation). This chapter owns *what lives where* in the
    # source tree. Without the explicit guard below, both chapters end
    # up walking through `make buildworld` phases — observed 2026-04-30
    # on the buildworld-flow key_question.
    scope_guard: >
      This is a tree-level overview. Do NOT feature specific subsystem
      structs (vm_page, vm_map, struct proc, struct vnode, struct
      vm_pagequeue, etc.) or code from inside sys/vm, sys/kern, etc.
      Those belong to their own chapters. When you mention sys/vm or
      sys/kern, give a one-sentence directory-purpose only and refer the
      reader to the relevant chapter. No struct field-by-field tables,
      no function-body excerpts, no #include details.

      Do NOT explain *how* the build system works — Makefile.inc1, the
      share/mk rule library, build phases (bootstrap tools, cross-tools,
      libraries, userland, kernel), src.conf(5) options, dependency
      tracking, out-of-tree builds, kernel config processing, and cross-
      compilation all belong to the Build System chapter (share/mk/README.md).
      You may mention that `make buildworld` exists, name the top-level
      Makefile, and link to the Build System chapter for details — but
      do NOT walk through the buildworld flow, do NOT enumerate the
      bsd.*.mk files, and do NOT show Makefile snippets here.
    source_dirs: []
    source_files:
      - "README.md"
      - "Makefile"
      - "UPDATING"
    focus: >
      Map the FreeBSD source tree layout: the directory taxonomy and the
      principle that source location mirrors install path. Cover the roles
      of bin/, sbin/, usr.bin/, usr.sbin/, lib/, sys/, stand/, contrib/,
      gnu/, cddl/, share/, rescue/, and tests/. Explain the licensing
      groups (base BSD code vs contrib/gnu/cddl). The *how* of the build
      itself is the Build System chapter's job — only point at it from here.
    key_questions:
      - "What lives in each top-level directory, and why?"
      - "What is the separation between base system and contrib/gnu/cddl code?"
      - "How are architecture-specific files organized under sys/ and stand/?"
    mermaid: flowchart

  - title: "Boot Process — UEFI Bootloader to Kernel Handoff"
    family: "boot-kernel-core"
    related:
      - "Kernel Core — Structure and Entry Point"
      - "Build System — buildworld and buildkernel"
    output_file: "stand/efi/loader/README.md"
    source_dirs:
      - "stand/efi/loader"
      - "stand/efi/loader/arch/amd64"
      - "stand/efi/loader/arch/arm64"
    source_files:
      - "stand/efi/loader/arch/amd64/elf64_freebsd.c"
      - "stand/efi/loader/arch/arm64/exec.c"
      - "stand/efi/loader/bootinfo.c"
    # The bootloader lives under stand/, not sys/. Without this, real
    # symbols (EFI_MEMORY_DESCRIPTOR, preloaded_file, elf64_exec,
    # bi_load, file_metadata) get falsely flagged as missing by the
    # fact-check pass and the fact-fix loop tells the writer to
    # "remove or correct" symbols that are actually correct.
    extra_search_dirs:
      - "stand"
    focus: >
      Document how loader.efi loads the kernel, passes the EFI memory map,
      and hands off control. Compare x86_64 and ARM64 boot metadata mechanisms.
    key_questions:
      - "How does the bootloader pass the memory map to the kernel?"
      - "What is struct bootinfo / bi_module and how is it used?"
      - "Why is the EFI memory map critical for VM initialization?"
    mermaid: sequence

  - title: "Kernel Core — Structure and Entry Point"
    family: "boot-kernel-core"
    related:
      - "Source Tree — Layout and Conventions"
      - "Boot Process — UEFI Bootloader to Kernel Handoff"
      - "Process Management — Scheduling and Lifecycle"
    output_file: "sys/README.md"
    source_dirs:
      - "sys/kern"
      - "sys/amd64/amd64"
      - "sys/arm64/arm64"
    source_files:
      - "sys/kern/init_main.c"
      - "sys/amd64/amd64/locore.S"
      - "sys/amd64/amd64/machdep.c"
      - "sys/arm64/arm64/locore.S"
      - "sys/sys/kernel.h"
    focus: >
      Trace kernel startup from _start through cpu_startup to init_main.
      Explain SI_SUB ordering, how subsystems are initialized, and the
      difference between early boot and userland bootstrap.
    key_questions:
      - "What happens between the last instruction of the bootloader and the first userland process?"
      - "How does the sysinit framework organize initialization?"
      - "What is the role of locore.S on each architecture?"
    mermaid: sequence

  - title: "Build System — buildworld and buildkernel"
    family: "boot-kernel-core"
    related:
      - "Boot Process — UEFI Bootloader to Kernel Handoff"
      - "Source Tree — Layout and Conventions"
    output_file: "share/mk/README.md"
    source_dirs:
      - "share/mk"
      - "tools/build"
    source_files:
      - "Makefile.inc1"
      - "share/mk/bsd.sys.mk"
      - "share/mk/bsd.kmod.mk"
      - "share/mk/bsd.prog.mk"
    # Companion guard to chapter 1 (Source Tree). The directory taxonomy
    # — what lives in bin/, sbin/, usr.bin/, lib/, contrib/, gnu/, etc.
    # — is owned by README_internals.md. Without this guard, the writer
    # restates the taxonomy here as preamble to "and then make builds
    # them," which duplicates ~half of chapter 1.
    scope_guard: >
      This chapter is about *how* the build orchestrates compilation, not
      *where* the source code lives. Do NOT enumerate the directory
      taxonomy (bin/ for system commands, sbin/ for system admin, lib/
      for libraries, contrib/ for third-party code, etc.) — that belongs
      to the Source Tree chapter (README_internals.md). When you need to
      reference where a category of source lives, give it a single phrase
      and link to the Source Tree chapter. Focus your prose on the
      Makefile hierarchy, share/mk rule files, build phases and their
      ordering, src.conf(5) options, kernel config processing, cross-
      compilation, dependency tracking, and out-of-tree builds.
    focus: >
      Explain how FreeBSD builds: the Makefile hierarchy, .conf files,
      options handling, and the difference between buildworld and buildkernel.
      Cover the staging areas and dependency tracking.
    key_questions:
      - "How does 'make buildworld' orchestrate the full build?"
      - "What is the role of Makefile.inc1?"
      - "How are kernel .conf files processed into source sets?"
    mermaid: flowchart

  - title: "System Calls and Image Activation — Entry, sysent, and exec"
    family: "boot-kernel-core"
    related:
      - "Kernel Core — Structure and Entry Point"
      - "Process Management — Scheduling and Lifecycle"
      - "Capsicum — Capability Mode and Sandboxing"
    output_file: "sys/kern/README_syscall.md"
    source_dirs:
      - "sys/kern"
      - "sys/sys"
    # The syscall entry path is split machine-independent (subr_syscall.c
    # drives the common enter/leave, kern_syscalls.c manages dynamic
    # registration) vs machine-dependent (the trap/SYSCALL stub in
    # amd64/amd64/trap.c that fills the trapframe). syscalls.master is the
    # generator input; init_sysent.c is its generated output — mention
    # both but do not paste the generated table. exec lives in kern_exec.c
    # with the ELF/shell image activators in imgact_*.c.
    source_files:
      - "sys/kern/subr_syscall.c"
      - "sys/kern/kern_syscalls.c"
      - "sys/kern/init_sysent.c"
      - "sys/kern/syscalls.master"
      - "sys/kern/kern_exec.c"
      - "sys/kern/imgact_elf.c"
      - "sys/kern/imgact_shell.c"
      - "sys/sys/sysent.h"
      - "sys/sys/imgact.h"
    # Guard against re-explaining process/thread creation (Process
    # Management owns fork/thread lifecycle) and Capsicum's per-fd rights
    # enforcement (Capsicum chapter). This chapter owns the *mechanism* of
    # crossing the user/kernel boundary and turning a file into a running
    # image, not scheduling or sandbox policy.
    scope_guard: >
      This chapter owns the system-call entry/exit mechanism and image
      activation (exec). Do NOT re-explain fork(), thread creation, or the
      scheduler — refer to the Process Management chapter; here, cover only
      what exec does to an *already-created* process's address space. Do
      NOT explain Capsicum capability-mode syscall filtering in depth —
      name the SV_CAPMODE / cap_enter interposition point and link to the
      Capsicum chapter. Do NOT paste the generated init_sysent.c table;
      explain syscalls.master as its source and how the build regenerates
      it. Keep the machine-dependent trap stub to a one-paragraph
      hand-off: focus on the machine-independent path in subr_syscall.c.
    focus: >
      Trace a system call from the userland INT/SYSCALL instruction
      through the machine-dependent trap stub into the machine-independent
      path in subr_syscall.c: how the syscall number indexes sysent[], how
      arguments are copied in (copyin/copyinstr) and results returned, and
      how errno propagates back. Explain struct sysent, syscalls.master as
      the generator source for init_sysent.c and the libc stubs, and how
      loadable modules register syscalls dynamically (kern_syscalls.c,
      SYSCALL_MODULE, NO_SYSCALL). Then cover image activation: how
      kern_exec.c probes registered image activators, how imgact_elf.c
      maps a static or dynamically-linked ELF binary (PT_LOAD segments,
      the interpreter/rtld, the auxiliary vector and initial stack), and
      how imgact_shell.c handles "#!" interpreter files. Connect the two:
      execve is itself a syscall that rebuilds the calling process's image.
    key_questions:
      - "What happens between a userland SYSCALL instruction and the C function that implements the call, and how does sysent[] drive that dispatch?"
      - "What is syscalls.master, and how does it generate init_sysent.c, the syscall.h numbers, and the libc stubs so all three stay in sync?"
      - "How does a kernel module add a new system call at runtime via SYSCALL_MODULE, and what is the role of the NO_SYSCALL dynamic offset?"
      - "How does imgact_elf.c turn an ELF file on disk into a running address space — PT_LOAD mapping, the rtld interpreter, and the auxiliary vector on the initial stack?"
    mermaid: sequence

  - title: "Kernel Modules and the Linker — KLD, SYSINIT, and linker sets"
    family: "boot-kernel-core"
    related:
      - "Kernel Core — Structure and Entry Point"
      - "Device Driver Framework — newbus and devclass"
      - "System Calls and Image Activation — Entry, sysent, and exec"
    output_file: "sys/kern/README_kld.md"
    source_dirs:
      - "sys/kern"
      - "sys/sys"
    # kern_linker.c is the linker-file abstraction + kldload/kldunload
    # backing; link_elf.c / link_elf_obj.c are the two ELF backends
    # (preloaded/.ko relocatable objects). kern_module.c is the module
    # registry that sits on top. subr_module.c handles preloaded-module
    # metadata from the loader. linker.h/module.h/kernel.h hold the KPI
    # macros (DECLARE_MODULE, MODULE_DEPEND, SYSINIT, the linker set
    # machinery in <sys/linker_set.h>).
    source_files:
      - "sys/kern/kern_linker.c"
      - "sys/kern/kern_module.c"
      - "sys/kern/link_elf.c"
      - "sys/kern/link_elf_obj.c"
      - "sys/kern/subr_module.c"
      - "sys/sys/linker.h"
      - "sys/sys/module.h"
      - "sys/sys/kernel.h"
    # newbus's DRIVER_MODULE is a *consumer* of this machinery — mention
    # the relationship but let the Device Driver Framework chapter own
    # driver attachment. SYSINIT ordering also drives early boot, which
    # the Kernel Core chapter owns; here, explain SYSINIT as the mechanism
    # modules hook into, not the boot sequence itself.
    scope_guard: >
      This chapter owns the kernel linker, the module registry, SYSINIT,
      and linker sets. Do NOT walk the boot-time SYSINIT ordering of the
      whole kernel — that belongs to the Kernel Core chapter; here explain
      SYSINIT/SYSUNINIT as the hook mechanism a module uses. Do NOT
      explain newbus driver attachment — DRIVER_MODULE is a consumer of
      DECLARE_MODULE; name the link and defer to the Device Driver
      Framework chapter. Keep ELF relocation detail at the level a module
      author needs (why .ko files are relocatable objects and what the
      linker resolves at load time), not a full ELF-format tutorial.
    focus: >
      Explain how FreeBSD loads code into a running kernel. Cover the
      linker-file abstraction in kern_linker.c (kldload/kldunload/kldstat,
      reference counting, symbol resolution) and its two ELF backends:
      link_elf.c for the statically-preloaded/kernel image and
      link_elf_obj.c for relocatable .ko objects. Explain the module
      registry (kern_module.c): DECLARE_MODULE, moduledata_t, the
      MOD_LOAD/MOD_UNLOAD/MOD_QUIESCE/MOD_SHUTDOWN event handler,
      MODULE_VERSION and MODULE_DEPEND. Then cover the two declarative
      mechanisms that make modular init work: SYSINIT/SYSUNINIT (ordered
      startup/teardown keyed by subsystem and order) and linker sets (how
      <sys/linker_set.h> gathers scattered declarations — sysctls,
      SYSINITs, device methods — into a contiguous table the linker
      builds). Note how the boot loader preloads modules before the kernel
      runs (subr_module.c metadata).
    key_questions:
      - "What is a linker file, and how do link_elf.c (the kernel image) and link_elf_obj.c (.ko relocatable objects) differ in how they resolve symbols?"
      - "What does DECLARE_MODULE register, and what is the contract of the MOD_LOAD/MOD_UNLOAD/MOD_QUIESCE event handler?"
      - "How does a linker set let independently-compiled files (sysctls, SYSINITs, drivers) contribute entries to one table without a central list, and how does the linker assemble it?"
      - "How does SYSINIT ordering (subsystem + order keys) let a loadable module insert its initialization at the right point relative to already-running subsystems?"
    mermaid: class

  - title: "Virtual Memory Subsystem — vm_page, UMA, and Pagers"
    family: "memory-process"
    related:
      - "Kernel Core — Structure and Entry Point"
      - "Buffer Cache — Block I/O Subsystem"
      - "VFS — Virtual File System Layer"
    output_file: "sys/vm/README.md"
    source_dirs:
      - "sys/vm"
      - "sys/amd64/amd64"
    source_files:
      - "sys/vm/vm_page.c"
      - "sys/vm/vm_map.c"
      - "sys/vm/vm_object.c"
      - "sys/vm/vm_fault.c"
      - "sys/vm/pmap.h"
      - "sys/amd64/amd64/pmap.c"
    focus: >
      Explain the FreeBSD VM architecture: vm_map entries, vm_objects,
      vm_pages, and the pmap layer. Cover page faults, virtual-to-physical
      translation, and the buddy allocator.
    key_questions:
      - "How does FreeBSD organize virtual address spaces?"
      - "What is the relationship between vm_map, vm_object, and vm_page?"
      - "How does the pmap layer abstract hardware page tables?"
    # The Deep Dive walks through page-fault handling — a sequence of
    # events between CPU, vm_fault, the pager, and the pmap layer — so a
    # sequence diagram tells that story better than the class diagram.
    # The class structure (vm_map → vm_map_entry → vm_object → vm_page) is
    # already conveyed by the Key Data Structures section's struct quotes.
    mermaid: sequence
    # Glossary is opt-in per chapter (not in _DEFAULT_SECTIONS). VM uses
    # heavy jargon — TLB shootdown, PML4, copy-on-write, slab, shadow
    # chain — that students need defined up front, before the Architecture
    # section starts using the terms.
    sections:
      - "Quick Summary"
      - "Glossary"
      - "Architecture"
      - "Key Data Structures"
      - "Deep Dive"
      - "Flow / Diagram"
      - "Advanced Notes"
      - "See Also"

  - title: "Process Management — Scheduling and Lifecycle"
    family: "memory-process"
    related:
      - "Kernel Core — Structure and Entry Point"
      - "Interrupt Handling — Threads, Filters, and Dispatch"
      - "Locking Primitives — Mutexes, sx, rmlocks, and Atomics"
      - "Jails — OS-level Isolation"
    output_file: "sys/kern/README_process.md"
    source_dirs:
      - "sys/kern"
    source_files:
      - "sys/kern/kern_fork.c"
      - "sys/kern/kern_exit.c"
      - "sys/kern/kern_thread.c"
      - "sys/kern/sched_4bsd.c"
      - "sys/kern/sched_ule.c"
    focus: >
      Cover process creation (fork/exec), the process struct (struct proc),
      thread representation (struct thread), and the scheduler. FreeBSD
      ships two schedulers behind the same sched(9) KPI: ULE
      (sched_ule.c), the default in GENERIC on amd64/arm64, and the
      historical 4BSD scheduler (sched_4bsd.c). Explain ULE first — its
      per-CPU run queues, interactivity scoring, CPU affinity and
      topology-aware load balancing — then contrast 4BSD's single global
      run queue and simpler priority decay, and note when 4BSD is still
      selected. Cover run queues, time slicing, and CPU assignment.
    key_questions:
      - "How does fork() create a new process in FreeBSD?"
      - "What is the relationship between proc and thread structures?"
      - "How does the ULE scheduler decide which thread runs next, and how do its per-CPU run queues and interactivity scoring differ from the 4BSD scheduler's single global queue?"
      - "Both schedulers implement the same sched(9) interface — what does that interface require, and how does the kernel pick between ULE and 4BSD at build time?"
    mermaid: sequence

  - title: "Locking Primitives — Mutexes, sx, rmlocks, and Atomics"
    family: "memory-process"
    related:
      - "Process Management — Scheduling and Lifecycle"
      - "Interrupt Handling — Threads, Filters, and Dispatch"
      - "Kernel Core — Structure and Entry Point"
    output_file: "sys/kern/README_locking.md"
    source_dirs:
      - "sys/kern"
      - "sys/sys"
    source_files:
      - "sys/kern/kern_mutex.c"
      - "sys/kern/kern_rwlock.c"
      - "sys/kern/kern_sx.c"
      - "sys/kern/kern_lock.c"
      - "sys/kern/subr_turnstile.c"
      - "sys/kern/subr_sleepqueue.c"
      - "sys/kern/subr_witness.c"
      - "sys/sys/mutex.h"
      - "sys/sys/rwlock.h"
      - "sys/sys/sx.h"
    focus: >
      Document the FreeBSD kernel locking toolkit. Cover the four main
      primitives — spin/sleep mutex (mtx), reader/writer lock (rwlock),
      shared/exclusive lock (sx), and lockmgr (legacy, used by VFS) —
      explaining when each is appropriate and what guarantees each
      provides. Cover the priority-propagation machinery (turnstiles)
      that prevents priority inversion on contended sleep mutexes, the
      sleep-queue mechanism that backs sx and condvar/msleep, and the
      WITNESS lock-order verifier. This subsystem cuts across every
      other chapter — readers hit mtx_lock everywhere and need a
      single place to understand what it actually does.
    key_questions:
      - "When should a developer reach for a mutex vs an sx vs a rwlock — what trade-off does each express?"
      - "What is a turnstile, and how does priority propagation defeat priority inversion on a contended mtx?"
      - "How does WITNESS detect lock-order reversals, and why is that a runtime check rather than a static one?"
      - "What is the difference between a spin mutex and a sleep mutex, and which contexts force you to use a spin mutex?"
    mermaid: class

  - title: "Signals, kqueue, and IPC — Process Communication and Notification"
    family: "memory-process"
    related:
      - "Process Management — Scheduling and Lifecycle"
      - "The Socket Layer — sockets, sockbuf, and UNIX-domain"
      - "VFS — Virtual File System Layer"
    output_file: "sys/kern/README_ipc.md"
    source_dirs:
      - "sys/kern"
      - "sys/sys"
    # Three related families of userland-facing kernel machinery:
    # (1) signals — kern_sig.c; (2) event notification — kern_event.c
    # (kqueue/kevent) plus the select/poll backend in sys_generic.c;
    # (3) IPC objects — sys_pipe.c (pipes/FIFOs), the SysV trio
    # (sysv_shm/msg/sem.c), the POSIX equivalents (uipc_shm.c shm_open,
    # uipc_sem.c named semaphores), and umtx (kern_umtx.c) which backs
    # userland pthread mutexes/condvars.
    source_files:
      - "sys/kern/kern_sig.c"
      - "sys/kern/kern_event.c"
      - "sys/kern/sys_generic.c"
      - "sys/kern/sys_pipe.c"
      - "sys/kern/uipc_shm.c"
      - "sys/kern/uipc_sem.c"
      - "sys/kern/sysv_shm.c"
      - "sys/kern/kern_umtx.c"
      - "sys/sys/signalvar.h"
      - "sys/sys/event.h"
    # UNIX-domain sockets and fd-passing are IPC too, but they belong to
    # the Socket Layer chapter (they ride the socket KPI). Name them and
    # link; do not cover uipc_usrreq.c here. Scheduler/thread wakeups
    # (sleepqueue, msleep) belong to Locking/Process Management — kqueue's
    # EVFILT_PROC and signal delivery *interact* with those, so reference
    # them, but the sleep/wakeup mechanism itself is out of scope.
    scope_guard: >
      This chapter owns signals, kqueue/kevent, select/poll, pipes/FIFOs,
      SysV and POSIX shared memory and semaphores, and umtx. Do NOT cover
      UNIX-domain sockets or file-descriptor passing — those ride the
      socket KPI and belong to the Socket Layer chapter; name them and
      link. Do NOT re-explain the sleepqueue/turnstile wakeup machinery
      (Locking chapter) or run-queue scheduling (Process Management) —
      reference how signal delivery and EVFILT_PROC interact with them,
      but keep the mechanism out of scope. Treat the userland API surface
      (sigaction, kevent, shm_open) as the framing, but focus the prose on
      the in-kernel data structures and delivery paths.
    focus: >
      Document the kernel machinery behind process communication and
      notification. Signals (kern_sig.c): the per-process/per-thread
      pending sets, signal disposition and masks, how a signal is posted
      (from a syscall, a device, or another process) and delivered at the
      next AST/return-to-userland boundary, and the special uncatchable
      cases. Event notification: kqueue/kevent (kern_event.c) as the
      scalable, edge/level filter mechanism (knote, the EVFILT_* filters
      for read/write/vnode/proc/signal/timer), and the older select/poll
      backend in sys_generic.c. IPC objects: anonymous pipes and named
      FIFOs (sys_pipe.c), the System V shared-memory/message-queue/
      semaphore trio, their POSIX counterparts (shm_open-backed uipc_shm.c
      and named semaphores in uipc_sem.c), and umtx (kern_umtx.c) as the
      kernel assist behind userland pthread mutexes and condition
      variables. Emphasize which primitive a program should reach for and
      why kqueue superseded select/poll for high-fd-count servers.
    key_questions:
      - "How is a signal represented and delivered — where does it sit pending, and at what point in returning to userland is the handler actually run?"
      - "What is a knote, and how does kqueue let one kevent() call scale to thousands of descriptors where select/poll cannot?"
      - "What is the difference between SysV IPC (sysv_shm/msg/sem) and the POSIX equivalents (shm_open, sem_open), and why does FreeBSD carry both?"
      - "What does umtx do for userland threads, and why can't pthread mutexes be implemented purely in userland without kernel help under contention?"
