      - "sys/ddb/db_command.c"
      - "sys/ddb/db_examine.c"
      - "sys/ddb/db_ps.c"
      - "sys/kern/kern_shutdown.c"
      - "sys/kern/kern_dump.c"
      - "sys/kern/subr_prf.c"
      - "sys/kern/kern_ktr.c"
    # DTrace is the *live, production, dynamic* tracing tool; this chapter
    # is the *interactive debugger + post-mortem* toolchain. They are
    # complementary — say so explicitly and do NOT re-explain providers,
    # DIF, or fbt here. WITNESS/lock diagnostics are the Locking chapter's;
    # reference how "show lockchain"/"show alllocks" surface them in DDB.
    scope_guard: >
      This chapter owns the interactive debugger and post-mortem
      toolchain: KDB (the backend framework), DDB (the in-kernel
      debugger), the panic/reboot/crash-dump path, savecore/kgdb analysis,
      and KTR. Do NOT re-explain DTrace — it is the complementary
      *live/dynamic* tracing tool; state the division of labor (DTrace for
      production instrumentation of a running system; DDB/dumps for a
      wedged or panicked one) and link. Do NOT re-derive the WITNESS lock
      verifier (Locking chapter) — show how its state is surfaced via DDB
      commands (show lockchain, show alllocks) but defer the mechanism.
      Keep printf/console detail (subr_prf.c) to what matters for
      debugging: log levels, the message buffer, and why printf is unsafe
      in some contexts.
    focus: >
      Document how a FreeBSD developer inspects a wedged or crashed
      kernel. KDB (subr_kdb.c): the debugger backend framework — how
      kdb_enter is reached from a panic, a trap, a watchdog, or a console
      break, and how backends register. DDB (sys/ddb): the in-kernel
      interactive debugger — command dispatch (db_command.c), memory and
      register examination (db_examine.c), stack tracing, and the "show"
      commands (db_ps.c and friends) that decode live kernel state
      (processes, locks, mbufs). The crash path: panic() and the
      reboot/dump sequence in kern_shutdown.c, writing a dump to the dump
      device (kern_dump.c), and post-mortem analysis with savecore + kgdb
      against the vmcore. KTR (kern_ktr.c): the low-overhead ring-buffer
      event tracer for reconstructing what happened just before a hang or
      race. And subr_prf.c: printf/log/the message buffer and why some
      contexts forbid them. Position the whole chapter as the
      complement to DTrace: DTrace observes a healthy running system;
      this toolchain dissects a broken one.
    key_questions:
      - "What paths lead into KDB (panic, trap, console break, watchdog), and what can you actually do once DDB has the console?"
      - "What happens between panic() and a saved crash dump — the kern_shutdown.c reboot path, kern_dump.c writing to the dump device, and savecore recovering it on reboot?"
      - "How do you analyze a vmcore after the fact with kgdb, and what do DDB 'show' commands (show lockchain, show alllocks, ps) tell you about a deadlock?"
      - "When do you reach for KTR or DDB versus DTrace — what can each see that the other cannot?"
    mermaid: sequence

  - title: "netgraph — Graph-based Networking Framework"
