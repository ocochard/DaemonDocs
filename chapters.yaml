  - title: "NFS — Network File System, Client and Server"
    family: "storage-io"
    related:
      - "VFS — Virtual File System Layer"
      - "UFS — FreeBSD's Native Filesystem"
      - "The Socket Layer — sockets, sockbuf, and UNIX-domain"
    output_file: "fs/nfs/README.md"
    source_dirs:
      - "sys/fs/nfs"
      - "sys/fs/nfsclient"
      - "sys/fs/nfsserver"
      - "sys/rpc"
    # The modern (post-2011 rewrite) NFS lives in fs/nfs (shared common
    # code + XDR), fs/nfsclient (the VFS/vnode ops that turn file
    # operations into RPCs), and fs/nfsserver (the nfsd that services
    # them). It rides SunRPC/XDR in sys/rpc. nfsport.h is the FreeBSD
    # portability shim over the OpenSolaris-derived core.
    source_files:
      - "sys/fs/nfsclient/nfs_clvfsops.c"
      - "sys/fs/nfsclient/nfs_clrpcops.c"
      - "sys/fs/nfsserver/nfs_nfsdserv.c"
      - "sys/fs/nfsserver/nfs_nfsdkrpc.c"
      - "sys/fs/nfs/nfs_commonsubs.c"
      - "sys/fs/nfs/nfsport.h"
      - "sys/rpc/clnt.h"
    # VFS owns the vnode/VOP abstraction; this chapter shows how NFS
    # *implements* that abstraction over the wire. The Socket Layer owns
    # sockets; here, sockets are just the transport RPC rides on. Do not
    # re-derive either — link. Keep the on-wire protocol (NFSv3 vs NFSv4
    # differences, stateful vs stateless) as framing, not an RFC recital.
    scope_guard: >
      This chapter shows how NFS implements the VFS/vnode contract over a
      network. Do NOT re-explain the vnode/VOP abstraction (VFS chapter)
      or local on-disk layout (UFS chapter) — link to them; here, cover
      how a VOP on an NFS vnode becomes an RPC. Do NOT re-explain the
      socket layer — treat the socket as the transport SunRPC rides on and
      link. Keep protocol-version detail (NFSv3 statelessness vs NFSv4
      compound ops, state, and delegations) at the level needed to explain
      the code paths, not a full RFC walkthrough. The userland mountd/nfsd
      plumbing is context, not the subject — the kernel nfsd and client
      RPC ops are.
    focus: >
      Document FreeBSD's NFS client and server as the canonical networked
      filesystem. Show the client side: how nfs_clvfsops.c mounts an
      export and how nfs_clrpcops.c turns vnode operations (lookup, read,
      write, getattr) into SunRPC calls, plus the caching model (attribute
      caching, the buffer-cache interaction, close-to-open consistency).
      Show the server side: how nfs_nfsdkrpc.c dispatches incoming RPCs to
      the nfsd service routines in nfs_nfsdserv.c, and how those map back
      onto local VFS operations. Cover the shared substrate: XDR
      encoding/decoding in nfs_commonsubs.c, the SunRPC transport in
      sys/rpc, and the NFSv3-vs-NFSv4 split (stateless per-op vs stateful
      compound operations with state and delegations). Frame NFS as the
      concrete answer to "how does VFS reach a file that isn't on a local
      disk."
    key_questions:
      - "How does a read() on an NFS-mounted file become an RPC — the path from VOP_READ through nfs_clrpcops.c, XDR encoding, and the SunRPC transport?"
      - "How does the client keep cached data coherent with the server (attribute caching, close-to-open consistency) without a distributed lock on every access?"
      - "How does the kernel nfsd dispatch an incoming request (nfs_nfsdkrpc.c → nfs_nfsdserv.c) and translate it back into local VFS operations?"
      - "What changes architecturally between NFSv3 (stateless, per-operation) and NFSv4 (stateful compound operations, delegations), and how does the shared code accommodate both?"
    mermaid: sequence

