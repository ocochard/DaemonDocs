  - title: "VNET — Virtual Network Stacks"
    family: "networking"
    related:
      - "Network Stack — Architecture and Packet Flow"
      - "Jails — OS-level Isolation"
      - "pf — OpenBSD-derived Packet Filter"
    output_file: "sys/net/README_vnet.md"
    source_dirs:
      - "sys/net"
    source_files:
      - "sys/net/vnet.c"
      - "sys/net/vnet.h"
    focus: >
      Document VNET, FreeBSD's per-jail network-stack virtualization.
      VNET turns nearly every global in the network stack — ifnet
      lists, routing tables, pf/ipfw rule sets, TCP/UDP PCB hashes,
      net.* sysctl values — into a per-vnet instance, so a vnet jail
      sees a completely independent network world. Cover the
      VNET_DEFINE / VNET / CURVNET_SET machinery, how vnet context is
      switched on every packet entering or leaving a jail, the
      destruction protocol (deferred teardown), and the cost model
      (memory per vnet, sysctl overhead). Distinguish from chapter 12
      (jail process isolation) — VNET is the network half.
    key_questions:
      - "What does VNET_DEFINE actually expand to, and how is per-vnet storage laid out at link time?"
      - "How does CURVNET_SET / CURVNET_RESTORE switch the vnet context on a per-packet basis without locking overhead?"
      - "What is the relationship between a jail and a vnet — when does a jail get its own vnet, and when does it share the host's?"
      - "How is a vnet torn down safely when its jail is destroyed, given that mbufs and timers may still reference its state?"
    mermaid: class

